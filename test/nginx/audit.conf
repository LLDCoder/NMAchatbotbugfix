server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
  location = /healthz { proxy_pass http://backend:8000; }
  location = / { add_header Cache-Control "no-store" always; try_files /index.html =404; }
  location = /index.html { add_header Cache-Control "no-store" always; }
  location ~* \.(css|js|png|svg)$ { add_header Cache-Control "no-store" always; try_files $uri =404; }
  location / { try_files $uri =404; }
}
