server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_buffering off;
  }

  location /healthz {
    proxy_pass http://backend:8000;
  }

  # The entry document controls the versioned asset URLs and must not retain
  # an older CSS/JS pair after an audit routing change.
  location = / {
    add_header Cache-Control "no-store" always;
    try_files /index.html =404;
  }

  location = /index.html {
    add_header Cache-Control "no-store" always;
  }

  # Static assets must never fall back to index.html. A cached HTML response
  # for a CSS or JS URL renders the audit console without its styles.
  location ~* \.(?:css|js)$ {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  location / { try_files $uri /index.html; }
}
